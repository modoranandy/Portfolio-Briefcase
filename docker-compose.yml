version: '3.8'

services:
  # Servicio Backend (Laravel / PHP)
  laravel-app:
    image: php:8.2-fpm
    container_name: portfolio_laravel
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  # Servicio Frontend (Angular / Node)
  angular-app:
    image: node:20-alpine
    container_name: portfolio_angular
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "4200:4200"
    command: npm start